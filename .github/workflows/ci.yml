name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Exercise the supported desktop platform, including the Tcl-only UI tests.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the development environment
        run: |
          python -m venv .venv
          ./.venv/Scripts/python.exe -m pip install -e ".[dev]"
      - name: Lint
        run: ./.venv/Scripts/python.exe -m ruff check .
      - name: Typecheck
        run: ./.venv/Scripts/python.exe -m pyright
      - name: Run the complete test suite
        run: ./.venv/Scripts/python.exe -m pytest --junitxml=test-results/pytest.xml
      - name: Retain test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/pytest.xml
          if-no-files-found: ignore
          retention-days: 14
